# OpenMasjid Kiosk — one container that runs everything: the admin panel + setup page
# (/new), the API, the SQLite data store, and the bundled Android APK it serves. One
# image to install, one to update. It stays least-privilege: no privileged mode, no
# host networking, no devices, no Docker socket.
#
# Nothing to configure at install time: install it, press Open, and it takes you to the
# admin panel — sign in, choose your Stripe account, design your giving screen, and pair
# a tablet from Devices. All state is saved to /data.
services:
  app:
    # ── DEV BRANCH: the development channel ──────────────────────────────────
    # This MUST match `version:` in manifest.yaml exactly, and it must never be the moving :dev
    # tag. The dev channel is versioned: every dev build gets its own X.Y.Z-dev.N and its own
    # immutable image tag, and the catalog serves this file verbatim.
    #
    # Why not :dev, which is what this line used to say. OpenMasjidOS decides an app has an
    # update by comparing the catalog's `version` with the installed one. A dev entry that reused
    # the stable version and a moving tag changed NOTHING observable when a new build shipped —
    # same version string, same image reference — so the platform could not notify anyone and had
    # nothing to point at. Stable works precisely because each release has a distinct version and
    # a pinned image; dev now has the same property, via the prerelease version instead of a
    # digest. (0.11.0 < 0.12.0-dev.5 < 0.12.0: ahead of the last release, behind the next.)
    #
    # Bump BOTH this line and manifest.yaml's `version:` on every dev build you want installable,
    # and never publish the catalog entry before CI has pushed the matching image — the tag is
    # exact, so an entry that lands first is a pull failure on someone's box.
    #
    # :dev is still published as a convenience alias for `docker pull`, and every build also gets
    # :dev-<12-char commit sha> for identifying exactly what a box is running. Neither is what the
    # catalog installs. On `main` this line carries the release tag + @sha256 digest; a "merge to
    # main" must restore that form, and CI's "Check the compose image matches the channel" step
    # fails the build in both directions.
    image: ghcr.io/openmasjid-solutions/openmasjidkiosk:0.12.0
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # We are always served over HTTPS by the platform (manifest `https: true`), so the
      # session cookie must be marked Secure or the browser may drop it.
      COOKIE_SECURE: "1"
      # OpenMasjidOS Fabric: the platform writes these into the app's .env and runs
      # compose with --env-file, which only feeds ${VAR} SUBSTITUTION — so they must be
      # referenced here to actually reach the container (SSO + Stripe + notifications).
      # Empty defaults keep a standalone `docker compose up` quiet.
      OPENMASJID_BASE_URL: ${OPENMASJID_BASE_URL:-}
      OPENMASJID_APP_ID: ${OPENMASJID_APP_ID:-}
      OPENMASJID_APP_SECRET: ${OPENMASJID_APP_SECRET:-}
      # Our public URL for REMOTE kiosk adoption (manifest `domain: true` + `tunnel: true`). Empty
      # unless the admin turns on Remote access and exposes us. The live source of truth is
      # GET /api/fabric/site; this is the documented convenience mirror.
      OPENMASJID_PUBLIC_URL: ${OPENMASJID_PUBLIC_URL:-}
    ports:
      # host:container. OpenMasjidOS offers "Open" on the lowest published port and picks
      # a different free host port automatically if 7878 is already taken.
      - "7878:8080"
    volumes:
      - data:/data
    # Least-privilege hardening (safe alongside the named data volume) — mirrors the
    # OpenMasjid Donations posture. Drop all Linux capabilities, forbid privilege
    # escalation, and give /tmp its own ephemeral tmpfs.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  data:
