<!--
  Keyed / typed card entry for the kiosk, using Stripe.js CARD ELEMENT (card fields only — deliberately
  NOT the Payment Element, which surfaces Link / bank-account debits we don't want at a kiosk). Served
  LOCALLY by WebViewAssetLoader over https://appassets.androidplatform.net,
  so it runs inside our own (Lock-Task allow-listed) activity and NEVER launches an external browser:
  card authentication (3-D Secure) renders in an iframe on this page (redirect:'if_required'). The card
  number is entered into Stripe's iframe and tokenised on-device — our code/server never see the PAN.
  Results are handed back to the app via the `KioskPay` bridge; the app verifies server-side before it
  records. This page is OPAQUE and full-screen (its own backdrop) so nothing behind it shows through,
  and the card scrolls so it is never clipped.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <!--
      STRIPE.JS IS THE ONE EXTERNAL SCRIPT, and deliberately so. The platform's rule is "no CDNs, none"
      (OpenMasjidOS docs/APP_UI_DESIGN_SPEC.md §8), and this is the single exception in anything we
      ship: Stripe requires Stripe.js to be loaded directly from js.stripe.com for PCI compliance —
      bundling or self-hosting a copy is not permitted, and a copy we served would put our own code in
      the card data's path, which CLAUDE.md §2 forbids outright. It does not weaken the LAN-only
      reasoning behind the rule, because a card payment already needs outbound internet to Stripe
      (CLAUDE.md §8, "Internet reality"). If it fails to load, the script below shows a kind message
      instead of a broken form. Do not add a second one.
    -->
    <script src="https://js.stripe.com/v3/"></script>
    <style>
      :root {
        /* The campaign's colours, replaced at load from the fragment (&ac= and &on=). The ink always
           arrives WITH the fill — the tablet works it out by the same rule as the giving screen's
           buttons (bestTextOn, core ui/theme/Color.kt) — because a fixed near-black on a deep custom accent
           measured 1.8:1. These defaults are the kiosk's own: cyan, and the ink that reads on it. */
        --accent: #22d3ee;
        --on-accent: #0a0f14;
        /* The kiosk's fixed dark surfaces and inks (core Color.kt, which mirrors the platform's
           tokens.css). This page is always dark, like the kiosk around it. --color-backdrop is also
           the WebView's own background before this paints (core Color.kt CardEntryBackdrop). */
        --color-backdrop-top: #0f2942;
        --color-backdrop: #071726;
        --color-backdrop-end: #030d18;
        --color-surface-raised: #0a1828;
        --color-border: rgba(255, 255, 255, 0.08);
        --color-border-strong: rgba(255, 255, 255, 0.14);
        --color-ink: #f4f7fb;
        --color-ink-muted: #aebacd;
        --color-ink-faint: #8593ad;
        --color-danger-ink: #fca5a5;
        --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.4);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--color-ink);
        /* Opaque backdrop so the giving screen behind never shows through. */
        background: radial-gradient(120% 120% at 50% 0%, var(--color-backdrop-top) 0%, var(--color-backdrop) 55%, var(--color-backdrop-end) 100%);
      }
      /* A scrollable centring wrapper: if the card is taller than the screen the page scrolls instead
         of clipping the top (the old bug). */
      .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 28px 18px; }
      .card {
        width: 100%; max-width: 620px;
        /* Solid, flat card — no glass/blur. */
        background: var(--color-surface-raised);
        border: 1px solid var(--color-border);
        border-radius: 24px; padding: 30px 28px 24px;
        box-shadow: var(--shadow-card);
      }
      h1 { font-size: 1.7rem; margin: 0 0 4px; text-align: center; font-weight: 700; }
      .sub { color: var(--color-ink-muted); text-align: center; margin: 0 0 22px; font-size: 1.05rem; }
      #pe { margin-bottom: 18px; padding: 16px 14px; background: var(--color-backdrop); border: 1px solid var(--color-border-strong); border-radius: 12px; }
      #msg { color: var(--color-danger-ink); font-size: 0.95rem; margin: 0 0 14px; text-align: center; min-height: 1.1em; }
      button { width: 100%; border: 0; border-radius: 16px; cursor: pointer; font-weight: 700; }
      #pay { background: var(--accent); color: var(--on-accent); padding: 18px; font-size: 1.25rem; }
      #pay:disabled, #pay[aria-disabled="true"], #cancel[aria-disabled="true"] { opacity: 0.55; }
      #cancel { background: transparent; color: var(--color-ink-muted); padding: 14px; font-size: 1.05rem; font-weight: 600; margin-top: 8px; }
      /* The spinner is drawn in the button's own ink (currentColor = --on-accent), so it reads on
         whatever accent the campaign chose. */
      .spin { display: inline-block; width: 1.1em; height: 1.1em; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -3px; }
      @keyframes s { to { transform: rotate(360deg); } }
      /* Reduced motion (spec §7), unconditionally: the ring stops turning. "Processing…" beside it
         still says the form is busy, so nothing is lost. */
      @media (prefers-reduced-motion: reduce) {
        .spin { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Enter your card</h1>
        <p class="sub" id="amt">Secured by Stripe</p>
        <div id="pe"></div>
        <!-- An alert: a decline or a problem appears here on its own, after the donor has pressed Pay,
             so a screen reader has to be told rather than left to find it. -->
        <p id="msg" role="alert"></p>
        <button id="pay" disabled>Pay</button>
        <button id="cancel">Cancel</button>
      </div>
    </div>
    <script>
      (function () {
        function bridge(status, detail) {
          try { if (window.KioskPay && KioskPay.onResult) KioskPay.onResult(status, detail || ''); } catch (e) {}
        }
        var params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
        var cs = params.get('cs') || '';
        var pk = params.get('pk') || '';
        var ac = params.get('ac');
        var on = params.get('on');
        var amt = params.get('amt');
        var payLabel = params.get('pay') || 'Pay';
        // The fill and its ink together, or neither (spec §3): a new accent under the default ink is
        // exactly the pairing that failed. Only a well-formed #rrggbb reaches a style property.
        var HEX = /^#[0-9a-fA-F]{6}$/;
        if (ac && on && HEX.test(ac) && HEX.test(on)) {
          document.documentElement.style.setProperty('--accent', ac);
          document.documentElement.style.setProperty('--on-accent', on);
        }
        if (amt) document.getElementById('amt').textContent = amt + ' · Secured by Stripe';
        var payBtn = document.getElementById('pay');
        var cancelBtn = document.getElementById('cancel');
        var msg = document.getElementById('msg');
        payBtn.textContent = payLabel;
        // Not while a payment is confirming: Stripe may already have the card, and cancelling then
        // dropped the payment the app was about to finish, so a donor could be charged and nothing
        // recorded. (`busy` is the pay button's flag below; `var` makes it visible here.)
        cancelBtn.addEventListener('click', function () { if (busy) return; bridge('canceled', ''); });

        if (!cs || !pk || typeof Stripe === 'undefined') {
          msg.textContent = 'Couldn’t load the card form. Please check the tablet’s internet and try again.';
          return;
        }
        var stripe = Stripe(pk);
        // Stripe's card fields live in its own iframe, which cannot see this page's custom properties,
        // so they are handed the resolved values of the same tokens.
        var css = getComputedStyle(document.documentElement);
        function token(name) { return css.getPropertyValue(name).trim(); }
        // CARD ONLY: the single Card Element collects just the card number / expiry / CVC (+ postal).
        // We deliberately do NOT use the Payment Element — it surfaces "Link", which offers bank-account
        // (ACH) debits that are impractical at a donation kiosk. The Card Element has no Link, no bank,
        // no wallets by construction. 3-D Secure still renders in-page (no external browser).
        var elements = stripe.elements();
        var card = elements.create('card', {
          hidePostalCode: false,
          style: {
            base: {
              color: token('--color-ink'),
              fontSize: '18px',
              fontFamily: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
              iconColor: token('--accent'),
              '::placeholder': { color: token('--color-ink-faint') },
            },
            invalid: { color: token('--color-danger-ink'), iconColor: token('--color-danger-ink') },
          },
        });
        card.mount('#pe');
        card.on('ready', function () { payBtn.disabled = false; });
        // The Card Element's own change errors are validation errors, which Stripe writes for the
        // person typing ("Your card number is incomplete."), so they are shown as they come.
        card.on('change', function (e) { msg.textContent = e && e.error && e.error.message ? e.error.message : ''; });

        var busy = false;
        function resetBtn() { busy = false; payBtn.removeAttribute('aria-disabled'); cancelBtn.removeAttribute('aria-disabled'); payBtn.textContent = payLabel; }
        payBtn.addEventListener('click', function () {
          if (busy) return;
          busy = true; msg.textContent = '';
          // aria-disabled plus the `busy` guard above, not `disabled`: disabling the control that has
          // focus drops focus to the page, and a screen reader loses its place mid-payment. The button
          // also keeps a spoken name while it works — the spinner alone left it with none.
          payBtn.setAttribute('aria-disabled', 'true');
          cancelBtn.setAttribute('aria-disabled', 'true');
          payBtn.innerHTML = '<span class="spin" aria-hidden="true"></span> Processing…';
          stripe.confirmCardPayment(cs, { payment_method: { card: card } }).then(function (result) {
            if (result.error) {
              resetBtn();
              var t = result.error.type;
              // Stripe writes card_error and validation_error messages FOR the person holding the card
              // ("Your card was declined.", "Your card's security code is incomplete.") — those are shown
              // as they come. Every other type (api_error, invalid_request_error, …) is written for a
              // developer and can name a parameter or an id, so the donor gets a plain sentence instead
              // and the real message goes to the app, which logs it.
              var forDonor = t === 'card_error' || t === 'validation_error';
              msg.textContent = forDonor && result.error.message
                ? result.error.message
                : 'That card didn’t go through — no charge was made. Please try again.';
              // Card declines / validation stay on the form so the donor can fix + retry. Only a hard
              // (config/network) error hands back to the app so it can show its own message.
              if (t && !forDonor) bridge('failed', result.error.message || t);
            } else if (result.paymentIntent && ['succeeded', 'processing', 'requires_capture'].indexOf(result.paymentIntent.status) !== -1) {
              bridge('completed', result.paymentIntent.id);
            } else {
              resetBtn();
              msg.textContent = 'That didn’t complete. Please try again.';
            }
          }).catch(function () {
            // The call itself failed (almost always the connection), so say what to check — and claim
            // nothing about the card, because this page cannot know whether it was charged. (Nothing is
            // recorded from here: a donation only counts once the app has checked it with the server.)
            resetBtn();
            msg.textContent = 'That didn’t go through. Please check the tablet’s internet and try again.';
          });
        });
      })();
    </script>
  </body>
</html>
