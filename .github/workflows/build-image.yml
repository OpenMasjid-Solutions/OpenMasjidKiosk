name: Build image

# Builds the kiosk APK, bundles it into the app image, and pushes multi-arch
# (amd64 + arm64) to GHCR as
#   ghcr.io/<owner>/<repo-name>:<manifest version>   (+ :latest)
# The repo is named OpenMasjidKiosk, so the image is
#   ghcr.io/openmasjid-solutions/openmasjidkiosk
# which is what docker-compose.yml references.
#
# TWO CHANNELS (the org's Update Channel toggle in OpenMasjidOS — CLAUDE.md "Branching policy"):
#
#   main / v* tags  ->  :<manifest version>  +  :latest                        the stable channel
#   dev             ->  :<manifest version>  +  :dev  +  :dev-<12-char sha>    the development channel
#
# BOTH channels publish the manifest version, and the two can never collide because a dev version
# is always a PRERELEASE — `0.11.0-dev.3`, never `0.11.0`. The "Check the compose image matches the
# channel" step below enforces that in both directions: dev must be a prerelease, stable must not
# be. That invariant is what makes it safe to publish :<version> from a dev push, and it is the
# load-bearing part of this file — without it a dev build would overwrite an already-released
# stable tag with unreviewed content. Never add :latest to the dev tag list.
#
# The VERSIONED tag is what the catalog installs on both channels, so both are immutable. `:dev`
# and `:dev-<sha>` remain as conveniences only — `:dev` is a MOVING tag meaning "newest", and
# `:dev-<sha>` says exactly which commit a box is running, so a bad dev build stays diagnosable
# and rollback-able. Nothing installs either of them, and the compose must never name them.
#
# BOTH channels run the FULL pipeline — Gradle APK -> web -> server -> multi-arch image — so a dev
# image ships a dev APK built from the dev branch, and an arm64-only regression is caught on the
# channel that exists to catch it (masjid boxes are usually Raspberry Pis).
#
# After the FIRST successful run: make the GHCR package Public (org → Packages → package
# settings) so masjid hosts can pull it without authentication. Then copy the printed
# @sha256 digest into docker-compose.yml (the real integrity pin) and bump the manifest
# version for each release.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    # Changes that don't affect the image — skip the (slow) multi-arch build.
    # docker-compose.yml is NOT in the image build context, so re-pinning the @sha256
    # digest there must not trigger a rebuild that would move the tag off that digest.
    # CHANGELOG.md is deliberately NOT ignored: it ships in the image (the admin panel's
    # "What's new" reads it), so an image that skipped it would describe the wrong release.
    # `paths-ignore` has no re-include syntax, hence the explicit list rather than '**/*.md'.
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# :dev is a MOVING tag, so two overlapping dev builds race to own it — and the winner is whichever
# finishes LAST, not whichever is newer. This build is slow (Gradle APK + two architectures), which
# makes the overlap window wide, so a lagging older commit could repoint :dev backwards. Superseded
# dev builds are canceled so the tag follows the branch tip.
#
# Scoped to dev deliberately: a release build must never be canceled. (Tag pushes are each their
# own ref anyway, so they could not cancel one another regardless.)
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  # Nothing publishes with a red suite. Until this gate existed, `npm test` was never run in CI at
  # all: the Dockerfile's `npm run build` type-checked the shipping code, and that was the whole of
  # it — so every test pinning a bug that has already shipped once (the percent-encoded /api bypass,
  # the WhatsApp handler's fail-closed auth, the version-suffix pairing) could go red without
  # stopping a single image from reaching a masjid. Runs in parallel with the APK, and the APK is
  # much slower, so on a green run this costs no extra wall-clock.
  test:
    uses: ./.github/workflows/test.yml

  # Build (and sign, if secrets are set) the APK, exposed as the `kiosk-apk` artifact.
  #
  # Only the four signing secrets are passed. This used to be `secrets: inherit`, which handed the
  # APK job every repo secret — including CATALOG_PUSH_TOKEN, a PAT with write access to a DIFFERENT
  # repository — to a job whose whole purpose is to run Gradle against the public plugin and
  # dependency ecosystem. Nothing here can go wrong quietly: if a signing secret fails to arrive the
  # build falls back to a debug APK, and the collect step in build-apk.yml fails the run rather than
  # publishing a key-mismatched app to the fleet.
  apk:
    uses: ./.github/workflows/build-apk.yml
    secrets:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

  image:
    needs: [test, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image name, version + channel tags
        id: meta
        run: |
          ver=$(grep -E '^version:' manifest.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d "\"' \r")
          [ -n "$ver" ] || ver=latest
          owner=${GITHUB_REPOSITORY_OWNER,,}
          name=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/$name"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Which channel to publish is decided by the REF, not by the event, so a manual
          # workflow_dispatch run on `dev` can never publish :latest from dev code.
          if [ "$GITHUB_REF" = 'refs/heads/dev' ]; then channel=dev; else channel=stable; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          # No suffix on either channel any more. It existed because VERSION did not move on dev,
          # so a dev build had to be told apart from a stable one somehow. Dev builds now carry a
          # real prerelease version (X.Y.Z-dev.N) in VERSION itself, which both the server and the
          # APK read — so they already differ, and appending would give "0.11.0-dev.1-dev".
          echo 'suffix=' >> "$GITHUB_OUTPUT"
          # Multi-line output: nothing else may write to $GITHUB_OUTPUT between the delimiters,
          # or it would be swallowed into the value — so `channel` is written above, and the tags
          # are echoed straight into the block (no shell variable, so no YAML indentation can
          # leak into a tag).
          {
            echo 'tags<<TAGS_EOF'
            if [ "$channel" = dev ]; then
              # The VERSIONED tag is the one that matters: the catalog pins it, so it must be
              # immutable and must match manifest.yaml exactly. :dev and :dev-<sha> stay as
              # convenience aliases for pulling and for identifying a box — nothing installs them.
              echo "$image:$ver"
              echo "$image:dev"
              echo "$image:dev-${GITHUB_SHA::12}"
            else
              echo "$image:$ver"
              echo "$image:latest"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "publishing the $channel channel"

      # CLAUDE.md rule 6b says "bump all six together" and promises "CI fails the build on drift".
      # It did not — the only check was the compose tag against the manifest, two of seven fields.
      #
      # The gap is not cosmetic, because `server/package.json` is where `config.version` is READ
      # FROM. Bump the manifest and the compose but forget it, and the build is green, the image
      # publishes, and the server reports the PREVIOUS version — which the heartbeat then sends to
      # every tablet as `latestAppVersion`. The tablet compares that against its own versionName by
      # plain string inequality, so the whole fleet shows "Update available" for ever and installing
      # never clears it. That exact failure has already shipped twice, by two different routes.
      #
      # Both lockfiles carry the version twice (top level and `packages[""]`); the check reads the
      # first two `"version":` lines of each and requires them to agree with each other and with the
      # manifest, so a half-applied `npm version` is caught too.
      - name: Check every version field agrees
        run: |
          ver='${{ steps.meta.outputs.version }}'
          fail=0
          check() {
            if [ "$2" != "$ver" ]; then
              echo "::error file=$1::$1 says '$2', manifest.yaml says '$ver' — rule 6b: bump all of them together"
              fail=1
            else
              echo "ok  $1 = $2"
            fi
          }
          check VERSION "$(tr -d ' \r\n' < VERSION)"
          for f in server/package.json web/package.json; do
            check "$f" "$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -1)"
          done
          for f in server/package-lock.json web/package-lock.json; do
            n=$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -2 | sort -u | tr -d ' \n')
            check "$f" "$n"
          done
          exit $fail

      # docker-compose.yml is what the catalog serves to installers (it fetches the file from the
      # ref its registry entry pins), so this file IS a shipped artifact and the channel invariant
      # belongs here, before anything is published. Two symmetric mistakes are possible, and both
      # are quiet — the app builds, boots and looks fine either way:
      #
      #   1. dev's moving :dev line reaches a release. Every masjid on the stable channel would then
      #      install whatever happened to be on dev. Merging dev -> main without re-pinning is all
      #      it takes, and the merge is exactly when someone is in a hurry.
      #   2. a digest pin is left behind on dev. The dev channel would keep installing one frozen
      #      old build while CI happily publishes a :dev image nobody consumes — dev testing
      #      silently stops testing anything.
      #
      # A push to main is allowed to be unpinned for exactly one commit, because the release runbook
      # pins the digest only AFTER the image has been built from main — so that case warns.
      - name: Check the compose image matches the channel
        run: |
          img=$(grep -E '^[[:space:]]*image:' docker-compose.yml | head -1 | sed -E 's/^[[:space:]]*image:[[:space:]]*//' | tr -d "\"' \r")
          ver='${{ steps.meta.outputs.version }}'
          echo "compose image: $img"
          echo "manifest version: $ver"
          # EVERY service must be on the right image, not just the first — a sidecar left on an
          # old tag is a half-applied update that looks fine from the outside.
          count=$(grep -cE '^[[:space:]]*image:' docker-compose.yml)
          if [ "$count" -ne 1 ]; then
            echo "::error file=docker-compose.yml::this check reads the FIRST image: line, but the compose has $count. Extend it to cover every service before adding one."
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/heads/dev)
              # The dev channel is VERSIONED now, not moving. OpenMasjidOS detects an update by
              # comparing the catalog's version with the installed one, so a dev entry that reuses
              # the stable version and a moving :dev tag changes nothing observable when a build
              # ships — the platform cannot notify and has nothing to install. So the dev compose
              # must name the exact manifest version, and the two must not drift apart.
              case "$img" in
                *:dev|*:dev@*) echo "::error file=docker-compose.yml::the dev compose must reference the versioned tag :$ver, not the moving :dev tag — the catalog installs this line, and a moving tag makes every dev build undetectable"; exit 1 ;;
              esac
              case "$img" in
                *:"$ver") echo "ok — dev channel pinned to the manifest version ($ver)" ;;
                *:"$ver"@sha256:*) echo "ok — dev channel pinned to the manifest version + digest ($ver)" ;;
                *) echo "::error file=docker-compose.yml::the dev compose image must match manifest.yaml's version. manifest says '$ver', compose says '$img'. Bump both together."; exit 1 ;;
              esac
              case "$ver" in
                *-dev.*) echo "ok — $ver is a prerelease" ;;
                *) echo "::error file=manifest.yaml::a dev build's version must be a prerelease of the form X.Y.Z-dev.N (got '$ver'), so it can never equal a stable release and always sorts between the last one and the next"; exit 1 ;;
              esac ;;
            refs/tags/v*|refs/heads/main)
              # A prerelease version must never reach stable: it would tell every masjid they are
              # running a development build, and it sorts BELOW the release it was working toward.
              case "$ver" in
                *-dev.*|*-dev) echo "::error file=manifest.yaml::'$ver' is a development prerelease and must never ship to stable. Set the release version (e.g. 0.11.0) as part of the merge."; exit 1 ;;
              esac
              case "$img" in
                *:dev|*:dev@*) echo "::error file=docker-compose.yml::stable must never reference the moving :dev image — that would point every stable install at a development build. Re-pin to <version>@sha256:<digest>."; exit 1 ;;
                *-dev.*|*-dev@sha256:*) echo "::error file=docker-compose.yml::stable must not reference a development prerelease image ('$img')."; exit 1 ;;
              esac
              # THE VERSION IN THE TAG MUST MATCH THE MANIFEST, and until now nothing on the stable
              # side checked it — only "not a prerelease", "not :dev", and (on tags) "is pinned". So a
              # main compose left on the PREVIOUS release's digest passed green, and the vX.Y.Z tag
              # then shipped the previous release's code under the new version number to anyone
              # pinning by tag. That is exactly the trap rule 7c exists to prevent, and it had no
              # enforcement. CLAUDE.md records it happening twice.
              #
              # Graded the same way the digest check is, and for the same reason: on a TAG both the
              # version and the digest must be exact, because the tagged commit is what the catalog
              # pins. On a main BRANCH push it can only be a warning — the runbook's order is bump ->
              # build -> pin the digest CI just printed, so the first main build necessarily still
              # carries the old reference. Erroring there would make the release impossible to start.
              case "$GITHUB_REF" in
                refs/tags/v*)
                  case "$img" in
                    *:"$ver"@sha256:*) echo "ok — release is $ver and digest-pinned" ;;
                    *@sha256:*) echo "::error file=docker-compose.yml::this tag builds manifest version '$ver' but the compose pins '$img'. The tag would ship a DIFFERENT release's code under $ver. Tag the digest-pin commit for THIS version, not the version-bump commit before it."; exit 1 ;;
                    *) echo "::error file=docker-compose.yml::a release compose must digest-pin the image (@sha256:…), got '$img'. Did a dev merge land without re-pinning?"; exit 1 ;;
                  esac ;;
                *)
                  case "$img" in
                    *:"$ver"@sha256:*) echo "ok — main is $ver and digest-pinned" ;;
                    *@sha256:*) echo "::warning file=docker-compose.yml::main's compose is digest-pinned but names '$img' while the manifest says '$ver' — expected during a release, between the version bump and the digest re-pin. It MUST be re-pinned before tagging; the tag build will refuse it." ;;
                    *) echo "::warning file=docker-compose.yml::main's compose is not digest-pinned yet — pin the digest before tagging the release" ;;
                  esac ;;
              esac ;;
          esac

      # Pull the freshly built APKs into the build context so the Dockerfile bundles them. BOTH land
      # in ./apk/, which the Dockerfile copies wholesale into /app/public/download — so /new can
      # hand out the wall KIOSK app and the handheld OpenMasjid Mobile Donations app.
      - name: Fetch built kiosk APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kiosk-apk
          path: apk

      - name: Fetch built mobile APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mobile-apk
          path: apk

      # Both, by exact filename. The server checks each independently and /new offers only what is
      # actually there, so a missing one would degrade quietly rather than fail — which is the wrong
      # failure here: an image that silently ships without the app someone is standing there waiting
      # to install is worse than a red build.
      - name: Confirm both APKs are present
        run: ls -la apk && test -f apk/openmasjidkiosk.apk && test -f apk/openmasjidmobile.apk

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags come from the channel resolved above: the manifest version on BOTH channels, plus
      # :latest on main / v* tags, and the moving :dev + immutable :dev-<sha> conveniences on the
      # dev branch. Multi-arch is not optional on either channel — masajid run this on Raspberry
      # Pis (arm64) as well as amd64 hosts, and the dev channel is precisely where a Pi-only
      # regression should surface.
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Empty on the stable channel, so a release image is unchanged by this.
          build-args: |
            APP_VERSION_SUFFIX=${{ steps.meta.outputs.suffix }}
          # Cache is scoped per CHANNEL (the OpenMasjidDisplay pattern). GitHub evicts the least
          # recently used entries from a fixed per-repo budget, and this is the org's heaviest build
          # — a busy day on dev would otherwise evict the layers a release restores from, making the
          # release both slower and less reproducible. main and every v* tag still share one warm
          # `stable` cache; dev keeps its own.
          cache-from: type=gha,scope=${{ steps.meta.outputs.channel }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.channel }}

      # On the stable channel the @sha256 digest is the real integrity pin — copy it into
      # docker-compose.yml. On dev the compose already names this build's own version tag, which is
      # immutable in its own right, so there is nothing further to pin; a digest there is allowed
      # but not required. :dev-<sha> is how you identify or roll back one specific dev build.
      - name: What was published
        run: |
          echo "channel: ${{ steps.meta.outputs.channel }}"
          echo "version: ${{ steps.meta.outputs.version }}"
          echo "digest:  ${{ steps.build.outputs.digest }}"
          if [ "${{ steps.meta.outputs.channel }}" = stable ]; then
            echo "Pin this in docker-compose.yml:"
            echo "  image: ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}"
          else
            echo "The dev channel installs the versioned tag, which is already immutable:"
            echo "  image: ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}"
            echo "Nothing to pin. To identify or roll back this exact build, use the commit tag:"
            echo "  ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}:dev-$(echo ${{ github.sha }} | cut -c1-12)"
          fi

      # Tell the OpenMasjidAPPS catalog to rebuild so the App Store picks up this build. Never
      # fails the build if the token is absent — a catalog refresh failing must not fail an image
      # that already published.
      #
      # THE SECRET IS MISSPELT AT SOURCE. The org secret is named CATLOG_PUSH_TOKEN — no "A" —
      # while every app in the family asks for CATALOG_PUSH_TOKEN. It therefore always resolved to
      # the empty string and this step silently took the skip path, which is why repository_dispatch
      # has fired ZERO times org-wide even in repos where the step was already enabled. Widening the
      # `if:` alone changed nothing; the runs still printed "CATALOG_PUSH_TOKEN not set".
      #
      # An unset secret is the empty string, which is falsy, so `||` takes whichever name exists.
      # That works today AND keeps working after the secret is renamed, with no follow-up commit.
      # Drop the fallback once every repo is on the correct spelling. (OpenMasjidDisplay already
      # does this; OpenMasjidDonations and OpenMasjidStudents still ask only for the correct name
      # and so are still silently skipping.)
      #
      # This step is placed AFTER "Build and push" deliberately, and that ordering is now load-
      # bearing on dev as well as on a release. The catalog pins an EXACT image tag, so an entry
      # that lands before its image exists is a pull failure on someone's box. Dispatching from
      # here means the image is already in GHCR when the catalog goes looking.
      #
      # It does not close the window entirely: OpenMasjidAPPS also rebuilds hourly, so a tick that
      # lands during this workflow (~7 min) can still catch the new manifest version before the
      # image is pushed.
      #
      # WHAT ACTUALLY HAPPENS IN THAT WINDOW, observed 2026-08-21 and NOT what this comment used to
      # claim. It said "a missing tag fails loudly rather than silently". It does not fail at all:
      # the catalog quietly falls back to our STABLE entry, so for the length of the window a
      # dev-channel box is told the current version is the last release. Timeline from that day:
      #
      #   15:55:52Z  dev push; manifest on the branch already says 0.12.0-dev.9
      #   16:00:12Z  catalog rebuild -> kiosk 0.11.0     (image not in GHCR yet)
      #   16:01:48Z  catalog rebuild -> kiosk 0.11.0
      #   16:02:59Z  this workflow finishes; :0.12.0-dev.9 pushed
      #   16:03:15Z  catalog rebuild -> kiosk 0.12.0-dev.9   (recovered on its own)
      #
      # Every other app kept its own dev prerelease throughout, so this is the catalog resolving
      # OUR entry specifically and choosing `ref:` over `dev_ref:` when the dev image is missing.
      # Self-healing, roughly three minutes, and it has never been seen to strand anything — but a
      # silent cross-channel DOWNGRADE is a worse shape than a loud pull failure, because nothing
      # anywhere reports it. Keeping the previous dev entry would be the better fallback; that is a
      # catalog-side decision, not ours.
      #
      # None of this is avoidable from here: the bump and the build are already the same push, and
      # the gap between the manifest landing on the branch and the image existing is inherent.
      - name: Notify catalog to rebuild
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CATALOG_PUSH_TOKEN || secrets.CATLOG_PUSH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Neither CATALOG_PUSH_TOKEN nor CATLOG_PUSH_TOKEN is set — skipping catalog dispatch."
            echo "The dev catalog will still refresh on OpenMasjidAPPS's cron, but not promptly."
            exit 0
          fi
          gh api repos/OpenMasjid-Solutions/OpenMasjidAPPS/dispatches -f event_type=rebuild-catalog
          echo "Requested an OpenMasjidAPPS catalog rebuild."
