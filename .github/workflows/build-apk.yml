# Builds (and, when signing secrets are present, SIGNS) the Android kiosk APK and
# publishes it as the `kiosk-apk` artifact (a single file: openmasjidkiosk.apk). The
# versionName comes from the repo-root VERSION file (android/app/build.gradle.kts reads
# it), so the app version always matches the server image.
#
# This is a REUSABLE workflow (`workflow_call`) so build-image.yml can build the APK and
# bundle the FRESH result into the container image in the same run. It can also be run on
# its own (tags / manual) to attach a downloadable APK to a release.
#
# One-time setup to ship a Play/sideload-signed APK — add these repo Actions secrets:
#   SIGNING_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   SIGNING_KEYSTORE_PASSWORD store password
#   SIGNING_KEY_ALIAS         key alias
#   SIGNING_KEY_PASSWORD      key password
# Without them the job still produces a DEBUG-signed APK so the pipeline never blocks
# (fine for testing; sideloading a debug APK works, but ship a release-signed one).
#
# NOTE: Android CI specifics (SDK components, AGP/Gradle/JDK alignment) could not be
# validated on the dev machine (JDK 8 only). Confirm on the first CI run.

on:
  workflow_call:
    # Named explicitly rather than taking `secrets: inherit` from the caller. Inherit hands this job
    # EVERY repo secret, including the cross-repo catalog PAT it has no use for — and this is the job
    # that runs Gradle, which resolves plugins and dependencies from the internet. The four below are
    # all it needs. Each is `required: false` so a fork, or a run before the signing secrets exist,
    # still builds: the job then produces a debug APK, which the collect step refuses to publish.
    secrets:
      SIGNING_KEYSTORE_BASE64:
        required: false
      SIGNING_KEYSTORE_PASSWORD:
        required: false
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false
    outputs:
      artifact:
        description: Name of the uploaded APK artifact
        value: kiosk-apk
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if provided)
        id: signing
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kiosk.jks"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing keystore secret set — building a DEBUG-signed APK."
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      # NO channel suffix is passed to Gradle, on either channel. This job used to append "-dev" on
      # the dev branch, because VERSION was identical on both branches and the APK had to be told
      # apart somehow. VERSION now carries a real prerelease on dev (X.Y.Z-dev.N), so the APK is
      # already distinguishable — and appending would give "0.11.0-dev.1-dev".
      #
      # That is not cosmetic. The server bundled in the SAME image reports VERSION unsuffixed, the
      # heartbeat sends it to the tablet as latestAppVersion, and the tablet decides an update
      # exists by plain string inequality against its own versionName. A suffix on one side only
      # means every kiosk shows "Update available" for ever, and installing never clears it. That
      # is precisely the failure the suffix was invented to prevent, so the two halves must be
      # changed together — build-image.yml passes an empty APP_VERSION_SUFFIX for the same reason.
      - name: Build signed release APK
        if: steps.signing.outputs.have_keystore == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kiosk.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # Kept so a run without the signing secrets still proves the Kotlin compiles. Its output is
      # NEVER published — see the collect step below, which refuses anything but a release APK.
      - name: Build debug APK (no signing secrets)
        if: steps.signing.outputs.have_keystore != 'true'
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Collect APK as openmasjidkiosk.apk
        run: |
          set -eu
          # ONLY a release-signed APK may ever be published. This APK is bundled into the server
          # image and served to tablets from /new, and Android will refuse to install an update
          # whose signing certificate differs from the installed one ("App not installed"),
          # recoverable only by uninstalling — which destroys the device token and the pinned
          # certificate and forces a physical re-pair at every tablet.
          #
          # The previous filter was `! -name '*unsigned*'`, which did NOT do this. The debug
          # fallback above emits app/build/outputs/apk/debug/app-debug.apk: that name contains no
          # "unsigned", and the file IS signed — with a throwaway per-run debug key. So a run with
          # the signing secrets missing (rotated out, org transfer, a fork) produced a green build
          # that shipped a key-mismatched APK to the whole fleet. Three independent guards now:
          #   1. look only inside the release/ output directory
          #   2. reject anything named *unsigned* or *debug* even if it is in there
          #   3. `sort` before picking, so a stray second APK can't win a race by directory order
          rel=app/build/outputs/apk/release
          apk=$(find "$rel" -maxdepth 1 -name '*.apk' ! -name '*unsigned*' ! -name '*debug*' 2>/dev/null | sort | head -1 || true)
          if [ -z "${apk:-}" ]; then
            echo "::error::No release-signed APK was produced, so there is nothing safe to publish."
            echo "have_keystore was '${{ steps.signing.outputs.have_keystore }}'. When that is false the"
            echo "build falls back to a DEBUG-signed APK, which is deliberately NOT publishable: it is"
            echo "signed with a throwaway per-run key, so every tablet in the field would fail to update"
            echo "with \"App not installed\". Restore the SIGNING_* repo secrets and re-run."
            echo "--- what the build actually produced ---"
            find app/build/outputs/apk -name '*.apk' 2>/dev/null || echo "(no APKs at all)"
            exit 1
          fi
          echo "Found $apk"
          # Best-effort, informational: print the signer so the key in use is visible in the log and
          # a change to it is noticeable. Never fails the build — apksigner's location varies.
          # ${ANDROID_HOME:-} matters: `set -u` would otherwise abort the whole step over an unset
          # variable, turning a perfectly good build into a failure at the last line.
          signer=$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -name apksigner -type f 2>/dev/null | sort -r | head -1 || true)
          if [ -n "${signer:-}" ]; then
            echo "--- signer ---"
            "$signer" verify --print-certs "$apk" 2>/dev/null | grep -iE 'signer .*(DN|SHA-256)' || echo "(could not read certs)"
          fi
          cp "$apk" "$RUNNER_TEMP/openmasjidkiosk.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kiosk-apk
          path: ${{ runner.temp }}/openmasjidkiosk.apk
          if-no-files-found: error
