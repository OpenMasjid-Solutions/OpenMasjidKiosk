<html lang="en" data-theme="dark" data-wallpaper="aurora">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030D1A" />
    <title>OpenMasjid Kiosk</title>
    <!-- The app's own logo — the same mark the App Store shows for this app (a copy of the
         repo-root icon.svg, kept in web/public so the build serves it). Relative href on
         purpose: the built page uses a relative asset base, so this resolves correctly
         whether the panel is reached at the root or under a /<basePath> prefix. -->
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <script>
      // Apply the persisted theme + wallpaper before first paint to avoid a flash of the
      // wrong look. The full prefs module (with OpenMasjidOS appearance inheritance)
      // hydrates immediately after.
      try {
        var p = JSON.parse(localStorage.getItem('omkiosk-prefs') || '{}');
        var t = p.theme === 'light' || p.theme === 'dark'
          ? p.theme
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        if (p.wallpaper) document.documentElement.setAttribute('data-wallpaper', p.wallpaper);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
